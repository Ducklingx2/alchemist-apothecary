<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Alchemist's Apothecary</title>

    <link rel="stylesheet" href="./style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <div id="loading">
        <div class="loading-rune">✦</div>
        <div class="loading-title">THE ALCHEMIST'S APOTHECARY</div>
        <div class="loading-subtitle">Preparing the laboratory...</div>
    </div>

    <div id="game">

        <div id="crosshair"></div>

        <div id="top-vignette"></div>

        <div id="hud">

            <div class="hud-title">
                THE ALCHEMIST'S APOTHECARY
            </div>

            <div class="hud-status">
                <span class="status-dot"></span>
                LABORATORY ACTIVE
            </div>

        </div>

        <div id="interaction">
            <div id="interaction-name"></div>
            <div id="interaction-hint"></div>
        </div>

        <div id="brew-status">
            <div class="brew-label">CAULDRON</div>

            <div class="brew-content">
                <span id="ingredient-count">0</span>
                ingredients
            </div>
        </div>

    </div>

    <script type="module" src="./js/main.js"></script>

</body>
</html>
